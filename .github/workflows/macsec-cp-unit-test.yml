name: MACsec CP unit test

# The paired regression uses OpenSSL for production MKA authentication.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  macsec-cp-wedge-ut:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Build the MACsec CP wedge unit test
        run: make -C tests test-macsec_cp_wedge

      - name: Run the MACsec CP wedge unit test
        run: ./tests/test-macsec_cp_wedge

      - name: Check the MACsec status reply text and length
        run: |
          make -C tests test-macsec_status
          ./tests/test-macsec_status

      - name: Install paired regression dependency
        run: sudo apt-get update -qq && sudo apt-get install -y libssl-dev

      - name: Check authenticated MACsec rollover
        run: |
          make -C tests test-macsec_rollover test-macsec_rollover-sanitize
          ./tests/test-macsec_rollover
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ./tests/test-macsec_rollover-sanitize
